<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iPhoneの画面</title>
  <style>:root{color-scheme:light dark;background:transparent;--canvas:#f8f8f8;--canvas-dot:#00000018;--text:#0d0d0d;--muted:#6e6e80;--surface:#fff;--surface-hover:#00000014;--line:#ebebeb;--control-shadow:0 2px 12px #00000008;--accent:#10a37f;--warn:#b7791f;--toast:#202123f2;--toast-text:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:transparent;--canvas-dot:#ffffff14;--text:#ececf1;--muted:#a1a1aa;--surface:#ffffff0f;--surface-hover:#ffffff1f;--line:#ffffff1f;--control-shadow:none;--accent:#19c37d;--warn:#e0a84a;--toast:#ececf1f5;--toast-text:#0d0d0d}}
:root[data-theme="dark"]{--canvas:transparent;--canvas-dot:#ffffff14;--text:#ececf1;--muted:#a1a1aa;--surface:#ffffff0f;--surface-hover:#ffffff1f;--line:#ffffff1f;--control-shadow:none;--accent:#19c37d;--warn:#e0a84a;--toast:#ececf1f5;--toast-text:#0d0d0d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#app{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px 16px 16px;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(circle,var(--canvas-dot) .8px,transparent 1px);background-size:20px 20px;color:var(--text);font:500 12px/1 ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Yu Gothic","PingFang SC","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#status{flex:none;display:inline-flex;align-items:center;gap:8px;max-width:100%;height:28px;padding:0 12px;border:.5px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--control-shadow);letter-spacing:.01em;white-space:nowrap;user-select:none}
#model{overflow:hidden;text-overflow:ellipsis;font-weight:600}
#live{flex:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
#app[data-live="live"] #live{color:var(--accent)}
#app[data-live="live"] .dot{opacity:1;animation:live-pulse 2.4s ease-in-out infinite}
#app[data-live="paused"] #live{color:var(--warn)}
#stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#toolbar{flex:none;display:inline-flex;align-items:center;gap:2px;padding:4px;border:.5px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--control-shadow)}
#toolbar button{appearance:none;display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;transition:background-color .15s ease,transform .1s ease,opacity .15s ease}
#toolbar button:hover{background:var(--surface-hover)}
#toolbar button:active{transform:scale(.94)}
#toolbar button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#toolbar button:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
#toolbar button[data-busy="true"]{opacity:1;animation:tool-busy 1s ease-in-out infinite}
#toolbar svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
#toast{position:absolute;left:50%;bottom:70px;z-index:5;max-width:calc(100% - 32px);padding:7px 12px;overflow:hidden;border-radius:999px;background:var(--toast);color:var(--toast-text);line-height:1.2;text-overflow:ellipsis;white-space:nowrap;transform:translateX(-50%);box-shadow:0 6px 20px -8px #00000059;pointer-events:none;animation:toast-in .18s ease-out}
#toast[data-tone="error"]{background:#b42318f2;color:#fff}
#toast[hidden]{display:none}
#device{--bezel:10px;--screen-radius:50px;position:relative;width:min(100%,350px);aspect-ratio:460/976;flex:none;isolation:isolate;border-radius:calc(var(--screen-radius) + var(--bezel));background:linear-gradient(115deg,#c4c0b9 0%,#686662 12%,#b1ada6 24%,#555452 51%,#96938e 72%,#c9c6c0 91%,#686762 100%);box-shadow:0 0 0 .7px #252525ad,0 12px 28px -14px #00000055,0 4px 8px -4px #00000033;user-select:none;pointer-events:none}
#device::before{content:"";position:absolute;inset:calc(var(--bezel) * .24);z-index:1;border-radius:calc(var(--screen-radius) + var(--bezel) * .76);background:#090a0c;box-shadow:0 0 0 .7px #00000099,inset 0 0 0 .7px #ffffff16;pointer-events:none}
#screen{position:absolute;inset:var(--bezel);z-index:2;isolation:isolate;overflow:hidden;border-radius:var(--screen-radius);background:#050609;line-height:0;user-select:none}
#device[hidden],#screen[hidden],.gesture-cursor[hidden]{display:none}
.side-button{position:absolute;z-index:0;width:calc(var(--bezel) * .27);left:calc(var(--bezel) * -.22);border-radius:calc(var(--bezel) * .15);background:linear-gradient(90deg,#5a5956,#b1aea7 55%,#5e5c59);box-shadow:0 0 0 .4px #35353280;pointer-events:none}
.action-button{top:15%;height:3.7%}
.volume-up{top:23%;height:6.4%}
.volume-down{top:32%;height:6.4%}
.power-button{left:auto;right:calc(var(--bezel) * -.22);top:26%;height:10.4%;background:linear-gradient(90deg,#5e5c59,#aaa7a1 45%,#5a5956)}
.receiver{position:absolute;left:50%;top:calc(var(--bezel) * .36);z-index:3;width:15%;height:calc(var(--bezel) * .19);transform:translateX(-50%);border-radius:999px;background:#030405;box-shadow:0 .5px 0 #ffffff19;pointer-events:none}
#device[data-orientation="landscape"] .side-button{left:auto;top:calc(var(--bezel) * -.22);height:calc(var(--bezel) * .27);background:linear-gradient(180deg,#5a5956,#b1aea7 55%,#5e5c59)}
#device[data-orientation="landscape"] .action-button{left:15%;width:3.7%}
#device[data-orientation="landscape"] .volume-up{left:23%;width:6.4%}
#device[data-orientation="landscape"] .volume-down{left:32%;width:6.4%}
#device[data-orientation="landscape"] .power-button{left:26%;right:auto;top:auto;bottom:calc(var(--bezel) * -.22);width:10.4%;background:linear-gradient(180deg,#5e5c59,#aaa7a1 45%,#5a5956)}
#device[data-orientation="landscape"] .receiver{left:calc(var(--bezel) * .36);top:50%;width:calc(var(--bezel) * .19);height:15%;transform:translateY(-50%)}
#image{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;user-select:none;pointer-events:none}
#image[hidden],#empty-state[hidden]{display:none}
#empty-state{position:absolute;inset:0;z-index:1;display:grid;place-items:center;background:radial-gradient(ellipse at 12% 0%,#ffffff08,transparent 56%),linear-gradient(145deg,#16171a,#090a0c 48%,#050609);color:#a9abb0;user-select:none}
.empty-state-content{display:flex;align-items:center;justify-content:center;max-width:calc(100% - 32px)}
#empty-state-text{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.empty-state-icon{width:36px;height:36px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;color:#b8babf}
.empty-state-icon g{display:none}
#empty-state[data-state="connecting"] [data-icon="connecting"],#empty-state[data-state="offline"] [data-icon="offline"],#empty-state[data-state="locked"] [data-icon="locked"],#empty-state[data-state="authentication"] [data-icon="authentication"],#empty-state[data-state="paused"] [data-icon="paused"],#empty-state[data-state="unavailable"] [data-icon="unavailable"]{display:block}
.empty-state-icon .symbol-dot{fill:currentColor;stroke:none}
#empty-state[data-state="connecting"] [data-icon="connecting"]{transform-box:view-box;transform-origin:center;animation:connecting-spin 1s linear infinite}
#app[data-page-visible="false"] [data-icon="connecting"]{animation-play-state:paused}
/* Static masks retain a faint top/bottom bridge and let it join during phase fades.
   Colour and dot-wave phases keep their independent 8s and 4s opacity cycles. */
.glow{position:absolute;inset:0;z-index:2;border-radius:inherit;opacity:0;transition:opacity .36s ease;pointer-events:none}
.glow-colors,.glow-dots,.glow i{position:absolute;inset:0;border-radius:inherit}
.glow i{--glow-phase-mask:var(--glow-mask);-webkit-mask:var(--glow-phase-mask,linear-gradient(#0000,#0000)) 0 0/100% 100% no-repeat;mask:var(--glow-phase-mask,linear-gradient(#0000,#0000)) 0 0/100% 100% no-repeat}
.glow-colors{--glow-cycle:8s;--hues:#6cc4ff,#3f9dff 17%,#8fdcff 33%,#58a9ff 49%,#7d8dff 62%,#b59bff 72%,#f2a8dc 82%,#9bd6ff 92%,#6cc4ff}
.glow-dots{--glow-cycle:4s;opacity:.72}
.glow i:nth-child(2){--glow-phase-mask:var(--glow-mask-1);opacity:0}
.glow i:nth-child(3){--glow-phase-mask:var(--glow-mask-2);opacity:0}
.glow-colors i:nth-child(1){background:conic-gradient(from 20deg,var(--hues))}
.glow-colors i:nth-child(2){background:conic-gradient(from 140deg,var(--hues))}
.glow-colors i:nth-child(3){background:conic-gradient(from 260deg,var(--hues))}
.glow-dots i{background-position:50% 50%;background-repeat:repeat}
.glow-dots i:nth-child(1){background-image:var(--glow-dots-0)}
.glow-dots i:nth-child(2){background-image:var(--glow-dots-1)}
.glow-dots i:nth-child(3){background-image:var(--glow-dots-2)}
#app[data-operating="true"] .glow{opacity:1;animation:glow-breathe 8s ease-in-out infinite}
#app[data-operating="true"] .glow i:nth-child(1){animation:glow-a var(--glow-cycle) linear infinite}
#app[data-operating="true"] .glow i:nth-child(2){animation:glow-b var(--glow-cycle) linear infinite}
#app[data-operating="true"] .glow i:nth-child(3){animation:glow-c var(--glow-cycle) linear infinite}
#app[data-page-visible="false"] .glow,#app[data-page-visible="false"] .glow i:nth-child(n),#app[data-page-visible="false"] .dot{animation-play-state:paused}
.dynamic-island{position:absolute;z-index:3;left:50%;top:calc(var(--bezel) * 1.17);width:calc(var(--bezel) * 11.25);height:calc(var(--bezel) * 3.46);transform:translateX(-50%);border-radius:999px;background:#030405;box-shadow:0 0 0 .5px #00000099,inset 0 .5px 0 #ffffff0d;pointer-events:none}
.dynamic-island::after{content:"";position:absolute;right:calc(var(--bezel) * .66);top:50%;width:calc(var(--bezel) * 1.65);height:calc(var(--bezel) * 1.65);transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle at 43% 38%,#274271 0%,#111d31 27%,#090c12 54%,#010203 73%);box-shadow:inset 0 0 0 .6px #111620;opacity:.7}
#device[data-orientation="landscape"] .dynamic-island{left:calc(var(--bezel) * 2.9);top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.gesture-cursor{position:absolute;z-index:4;width:26px;height:26px;margin:-13px 0 0 -13px;border:1.5px solid #ffffffe6;border-radius:50%;background:#80808066;box-shadow:0 0 0 1px #4c4c4c66,0 2px 6px #00000026;pointer-events:none;will-change:transform,opacity}
@keyframes glow-breathe{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes glow-a{0%,100%{opacity:1}33.33%,66.66%{opacity:0}}
@keyframes glow-b{0%,66.66%,100%{opacity:0}33.33%{opacity:1}}
@keyframes glow-c{0%,33.33%,100%{opacity:0}66.66%{opacity:1}}
@keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes tool-busy{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes toast-in{from{opacity:0}to{opacity:1}}
@keyframes connecting-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.glow{transition:none}#app[data-operating="true"] .glow,#app[data-operating="true"] .glow i:nth-child(n),#app[data-live="live"] .dot,#toolbar button[data-busy="true"],#toast,#empty-state[data-state="connecting"] [data-icon="connecting"]{animation:none}#toolbar button{transition:none}.gesture-cursor{will-change:opacity}}
</style>
</head>
<body>
  <main id="app" data-frame-seq="0" data-busy="false" data-operating="false" data-live="connecting" aria-label="iPhoneのリアルタイム画面">
    <header id="status">
      <span id="model">iPhone</span>
      <span id="live"><i class="dot" aria-hidden="true"></i><span id="live-text">接続中</span></span>
    </header>
    <div id="stage">
      <div id="device" data-orientation="portrait">
        <div class="side-button action-button" aria-hidden="true"></div>
        <div class="side-button volume-up" aria-hidden="true"></div>
        <div class="side-button volume-down" aria-hidden="true"></div>
        <div class="side-button power-button" aria-hidden="true"></div>
        <div class="receiver" aria-hidden="true"></div>
        <div id="screen">
          <img id="image" alt="iPhoneのリアルタイム画面" draggable="false" hidden>
          <div id="empty-state" data-state="connecting" role="status" aria-live="polite">
            <div class="empty-state-content">
              <svg class="empty-state-icon" viewBox="0 0 24 24" aria-hidden="true">
                <g data-icon="connecting"><circle cx="12" cy="12" r="8" opacity=".2"/><path d="M12 4a8 8 0 0 1 8 8"/></g>
                <g data-icon="offline"><path d="M8.5 3.25h7A2.25 2.25 0 0 1 17.75 5.5v7M6.25 9v9.5a2.25 2.25 0 0 0 2.25 2.25h7a2.25 2.25 0 0 0 2.25-2.25v-1"/><path d="M10.25 5.75h3.5M10.5 18.25h3M3.25 3.25l17.5 17.5"/></g>
                <g data-icon="locked"><rect x="5.5" y="10.25" width="13" height="10.5" rx="2.75"/><path d="M8 10.25v-3a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.25"/></g>
                <g data-icon="authentication"><path d="M12 2.75 20 6v5c0 4.5-3.5 7.8-8 10.25C7.5 18.8 4 15.5 4 11V6Z"/><rect x="8.5" y="10.75" width="7" height="5.5" rx="1.5"/><path d="M10 10.75V9a2 2 0 0 1 4 0v1.75"/></g>
                <g data-icon="paused"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 8.5v7M14.5 8.5v7"/></g>
                <g data-icon="unavailable"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.75"/><circle class="symbol-dot" cx="12" cy="16.5" r=".8"/></g>
              </svg>
              <span id="empty-state-text">接続しています</span>
            </div>
          </div>
          <div class="glow" aria-hidden="true">
            <div class="glow-colors"><i></i><i></i><i></i></div>
            <div class="glow-dots"><i></i><i></i><i></i></div>
          </div>
          <div class="dynamic-island" aria-hidden="true"></div>
          <div id="cursor" class="gesture-cursor" aria-hidden="true" hidden></div>
        </div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <nav id="toolbar" aria-label="iPhoneの操作">
      <button id="tool-refresh" type="button" aria-label="接続を更新" title="再接続します。認証完了後に押すとプレビューを再開できます">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 8.25A7.5 7.5 0 1 0 19.5 12"/><path d="M18.5 4.25v4h-4"/></svg>
      </button>
      <button id="tool-home" type="button" aria-label="ホーム画面に戻る" title="ホーム画面に戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 10.75 6.3-5.3a1.85 1.85 0 0 1 2.4 0l6.3 5.3"/><path d="M6.5 9.15V18A1.5 1.5 0 0 0 8 19.5h8a1.5 1.5 0 0 0 1.5-1.5V9.15"/><path d="M10 19.5v-5.75h4v5.75"/></svg>
      </button>
      <button id="tool-screenshot" type="button" aria-label="スクリーンショットをクリップボードにコピー" title="スクリーンショットをクリップボードにコピー">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 6.5 1.2-1.75h4.6l1.2 1.75H18a1.75 1.75 0 0 1 1.75 1.75v9.5A1.75 1.75 0 0 1 18 19.5H6a1.75 1.75 0 0 1-1.75-1.75v-9.5A1.75 1.75 0 0 1 6 6.5Z"/><circle cx="12" cy="12.75" r="3.25"/></svg>
      </button>
    </nav>
  </main>
