name: Check plugin
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm run build --prefix ui
      - run: git diff --exit-code -- assets/phone-screen.html
      - name: Run core tests, package validation, and widget tests
        run: sh scripts/check.sh
  host-adapters:
    name: Host adapter (${{ matrix.host }})
    runs-on: macos-latest
    env:
      IPHONE_USE_ANALYTICS: '0'
    strategy:
      fail-fast: false
      matrix:
        host: [workbuddy, doubao]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated host adapter tests
        run: python3 -m unittest discover -s "${{ matrix.host }}/tests" -v
