[package]
name = "wda-installer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
isideload = { path = "../vendor/isideload" }
idevice = { version = "=0.1.47", features = ["usbmuxd", "ring"], default-features = false }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
plist = "1"
icloud_auth = { package = "nab138_icloud_auth", version = "=0.1.5" }
omnisette = { package = "nab138_omnisette", version = "=0.1.3" }
tokio-tungstenite = "=0.27.0"

[patch.crates-io]
nab138_icloud_auth = { path = "../vendor/nab138_icloud_auth-0.1.5" }
nab138_omnisette = { path = "../vendor/nab138_omnisette-0.1.3" }
